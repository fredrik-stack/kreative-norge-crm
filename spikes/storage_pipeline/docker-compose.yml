services:
  moto:
    image: ghcr.io/getmoto/motoserver:5.2.2
    environment:
      MOTO_PORT: "5000"
      S3_IGNORE_SUBDOMAIN_BUCKETNAME: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20

  lab:
    build:
      context: ../..
      dockerfile: spikes/storage_pipeline/Dockerfile
    depends_on:
      moto:
        condition: service_healthy
    network_mode: "service:moto"
    environment:
      PHASE3B2_S3_ENDPOINT: "http://localhost:5000"
    command:
      - /bin/sh
      - -ec
      - >-
        python -m unittest discover -s /lab/storage_pipeline/tests -v &&
        python /lab/storage_pipeline/run_lab.py
        --output /tmp/phase3b2-storage-evidence.json
