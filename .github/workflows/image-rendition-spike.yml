name: Image rendition spike

on:
  pull_request:
    paths:
      - "spikes/image_pipeline/**"
      - "docs/status/PHASE_3B1_IMAGE_RENDITION_SPIKE.md"
      - "docs/status/evidence/phase3b1-image-contact-sheet.webp"
      - ".github/workflows/image-rendition-spike.yml"
  push:
    branches: ["main"]
    paths:
      - "spikes/image_pipeline/**"
      - "docs/status/PHASE_3B1_IMAGE_RENDITION_SPIKE.md"
      - "docs/status/evidence/phase3b1-image-contact-sheet.webp"
      - ".github/workflows/image-rendition-spike.yml"
  workflow_dispatch:

jobs:
  image-rendition-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: spikes/image_pipeline/requirements.txt

      - name: Install isolated image-lab dependencies
        run: pip install -r spikes/image_pipeline/requirements.txt

      - name: Run image-lab tests
        env:
          PYTHONPATH: spikes/image_pipeline
        run: python -m unittest discover -s spikes/image_pipeline/tests -v

      - name: Regenerate image-lab evidence
        env:
          PYTHONPATH: spikes/image_pipeline
        run: >-
          python spikes/image_pipeline/run_lab.py
          --output /tmp/phase3b1-image-lab-output
          --iterations 3
