name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backup-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck ops/backup/*.sh

      - name: Run synthetic backup tests
        run: python3 -m unittest discover -s ops/backup/tests -v

      - name: Verify systemd units
        run: |
          sudo install -d /usr/local/lib/kreative-norge-backup
          sudo install -m 0755 ops/backup/backup.sh ops/backup/verify.sh /usr/local/lib/kreative-norge-backup/
          systemd-analyze verify ops/backup/systemd/*.service ops/backup/systemd/*.timer

  image-safety-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ShellCheck
        run: shellcheck ops/image_safety/*.sh

      - name: Run ledger, crash, anchor, and restore tests
        run: python3 -m unittest discover -s ops/image_safety/tests -v

      - name: Verify systemd units
        run: |
          sudo install -d /usr/local/lib/kreative-norge-image-safety
          sudo install -m 0755 ops/image_safety/image-safety.sh /usr/local/lib/kreative-norge-image-safety/
          sudo install -m 0644 ops/image_safety/run.py /usr/local/lib/kreative-norge-image-safety/
          systemd-analyze verify ops/image_safety/systemd/*.service ops/image_safety/systemd/*.socket ops/image_safety/systemd/*.timer

  staging-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ops/staging/requirements-test.txt

      - name: Install staging contract dependencies
        run: pip install -r ops/staging/requirements-test.txt

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: Check staging shell scripts
        run: |
          bash -n ops/staging/prepare-image-storage.sh
          shellcheck ops/staging/prepare-image-storage.sh

      - name: Run staging contract tests
        run: python3 -m unittest discover -s ops/staging/tests -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-secret-key"
      DB_NAME: crm_db
      DB_USER: crm
      DB_PASSWORD: crm_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SMOKE_USERNAME: "smoke-ci"
      SMOKE_PASSWORD: "Smoke1234!"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test crm -v 2

      - name: Apply migrations for smoke DB
        run: python manage.py migrate --noinput

      - name: Run editor API smoke test
        run: python scripts/smoke_editor_api.py --tenant-id 1 --username "$SMOKE_USERNAME" --password "$SMOKE_PASSWORD"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks (tests + build)
        run: npm run ci:check

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-secret-key"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: crm_db
      DB_USER: crm
      DB_PASSWORD: crm_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: Apply backend migrations
        run: python manage.py migrate --noinput
        working-directory: .

      - name: Start backend server
        run: nohup python manage.py runserver 127.0.0.1:8000 > backend.log 2>&1 &
        working-directory: .

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8000/api/auth/session/ > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          exit 1
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
          if-no-files-found: ignore
